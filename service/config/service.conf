# 服务配置文件

# 服务名称
service_name user-service

# 服务监听端口
service_port 8081

# 网关URL
gateway_url http://localhost:8080

# 心跳间隔（秒）
heartbeat_interval 30

# 线程池大小
thread_pool_size 4

# 线程队列大小
thread_queue_size 100

# TLS证书文件路径
tls_cert_file cert.pem

# TLS私钥文件路径
tls_key_file key.pem

# 是否开启IPv6（0: 不开启, 1: 开启, 2: 双栈）
is_ipv6 0

# 是否开启HTTPS（0: 不开启, 1: 开启）
is_https 0

# 日志文件路径
log logs/service

# 是否校验证书（0: 不校验, 1: 校验）
verify_cert 0