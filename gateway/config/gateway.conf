# 网关配置文件

# 网关监听端口
port 8080

# 线程池大小
thread_pool_size 4

# 线程队列大小
thread_queue_size 100

# 最大连接数
max_connections 1000

# 最大缓存项数
max_cache_items 1000

# 最大缓存大小（字节）
max_cache_size 1048576

# 速率限制最大令牌数
rate_limit_max_tokens 1000

# 速率限制令牌填充速率（每秒）
rate_limit_refill_rate 100

# 服务注册表大小
service_registry_size 100

# 服务实例注册表大小
service_instance_size 32

# TLS证书文件路径
tls_cert_file cert.pem

# TLS私钥文件路径
tls_key_file key.pem

# 是否开启IPv6（0: 不开启, 1: 开启, 2: 双栈）
is_ipv6 0

# 是否开启HTTPS（0: 不开启, 1: 开启）
is_https 0

# 日志文件路径
log logs/gateway